<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Excuse Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4 sm:p-8">
    <div class="container mx-auto mt-8 p-4 md:p-8 card">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Intelligent Excuse Generator</h1>

        <!-- Excuse Generation Section -->
        <div class="mb-8">
            <!-- Removed: <h2 class="text-2xl font-semibold text-gray-700 mb-4">Generate a New Excuse</h2> -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label for="scenario" class="block text-gray-700 text-sm font-medium mb-2">Scenario (e.g., late for work, missed a deadline):</label>
                    <input type="text" id="scenario" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g., late for work">
                </div>
                <div>
                    <label for="urgency" class="block text-gray-700 text-sm font-medium mb-2">Urgency:</label>
                    <select id="urgency" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label for="details" class="block text-gray-700 text-sm font-medium mb-2">Additional Details (e.g., who it's for, desired tone):</label>
                    <textarea id="details" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g., for my boss, needs to sound very professional"></textarea>
                </div>
            </div>
            <button id="generateExcuseBtn" class="btn-primary w-full flex items-center justify-center">
                <span id="buttonText">Generate Excuse</span>
                <div id="loadingSpinner" class="loading-spinner ml-3 hidden"></div>
            </button>
        </div>

        <!-- Generated Excuse Display -->
        <div id="excuseOutput" class="mb-8 p-4 border border-gray-200 rounded-lg bg-gray-50 hidden">
            <h3 class="text-xl font-semibold text-gray-700 mb-3">Your Generated Excuse:</h3>
            <p id="generatedExcuseText" class="text-gray-800 leading-relaxed"></p>
            <div class="mt-4 flex flex-wrap gap-3">
            </div>
        </div>

        <!-- Excuse History Section -->
        <div>
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Excuse History</h2>
            <div id="excuseHistory" class="space-y-4">
                <p id="noHistoryMessage" class="text-gray-500 text-center">No excuses generated yet. Your history will appear here.</p>
            </div>
        </div>
    </div>

    <!-- Link to external JavaScript file -->
    <script type="module" src="script.js"></script>
</body>
</html>
<!-- File: style.css -->
